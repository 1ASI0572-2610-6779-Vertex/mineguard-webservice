# Defers creation of every non-essential bean (JPA repositories, EntityManagerFactory, Spring
# Security config) until first use instead of during startup. Tomcat's connector only starts
# accepting connections *after* all eager singletons are built — on Render's constrained/shared
# CPU this eager bootstrap alone was taking ~100+ of the ~138s total boot time, right up against
# Render's port-detection timeout and racing the shutdown hook. With lazy init, Tomcat opens the
# port almost immediately; the deferred beans finish initializing afterward (triggered by the
# ApplicationReadyEvent role-seeding call, or the first real HTTP request).
spring.main.lazy-initialization=true

# Production profile: Supabase PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# validate (not update): Hibernate only checks the existing schema matches the entities on boot —
# no ALTER TABLE statements. update was hanging the deploy indefinitely on Render, most likely
# waiting on a Postgres lock held by the previous (still-running, zero-downtime) instance's
# connection through the Supabase pooler. Schema changes now require a manual migration step.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
server.address=0.0.0.0
server.port=${PORT:8080}

# Configuracion de Brevo para correos (API HTTP transaccional, no SMTP).
# EmailServiceImpl envia todo via la API HTTP de Brevo (HTTPS/443) leyendo brevo.api.key —
# nunca usa JavaMailSender/SMTP. Render bloquea los puertos SMTP salientes (587/465), asi que
# un bloque spring.mail.host/port/username/password aqui seria codigo muerto que ademas
# tampoco funcionaria si se activara. SMTP_PASSWORD ya no es necesaria.
brevo.api.key=${BREVO_API_KEY}