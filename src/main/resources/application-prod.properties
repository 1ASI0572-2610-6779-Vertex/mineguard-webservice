# Production profile: Supabase PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# validate (not update): Hibernate only checks the existing schema matches the entities on boot —
# no ALTER TABLE statements. update was hanging the deploy indefinitely on Render, most likely
# waiting on a Postgres lock held by the previous (still-running, zero-downtime) instance's
# connection through the Supabase pooler. Schema changes now require a manual migration step.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
server.address=0.0.0.0
server.port=${PORT:8080}

# Configuracion de Brevo SMTP para correos en produccion
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=af229a001@smtp-brevo.com
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.ssl.checkserveridentity=false
spring.mail.properties.mail.smtp.starttls.required=true
