# Production profile: Supabase PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Configuracion de Brevo para correos (API HTTP transaccional).
# Se usa la API HTTP (HTTPS/443) en lugar de SMTP porque Render bloquea los puertos SMTP salientes.
brevo.api.key=${BREVO_API_KEY}
spring.mail.from=${MAIL_FROM:kalo18031234@gmail.com}
spring.mail.from-name=${MAIL_FROM_NAME:MineGuard Platform}
server.address=0.0.0.0