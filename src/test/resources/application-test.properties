spring.application.name=MineGuard Platform Test

spring.datasource.url=jdbc:h2:mem:mineguard_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.jpa.hibernate.naming.physical-strategy=com.mineguard.platform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

authorization.jwt.secret=WriteHereYourSecretStringForTokenSigningCredentialAndMakeItLongEnough
authorization.jwt.expiration.days=7

edge.device.default.device-id=smart-band-001
edge.device.default.api-key=test-api-key-123

brevo.api.key=test-key
spring.mail.from=test@mineguard.com
spring.mail.from-name=MineGuard Test